name: "SetData Has"
pattern: |
    1. For each element $elem:var of $base:ref, do
      1. If $elem:var is not ~empty~ and SameValue($elem:var, $value:var) is *true*, $body:step
replace: "1. If IN__SetDataHas($base:ref, $value:var) is *true*, $body:step"
predicate: $ref -> isSetData
subrules:
  - name: "SetData Has >> Rename Variable"
    type: reference
    pattern: "$elem:var"
    replace: "$value:var"
