name: "SetData While+Iterator"
pattern: |
    1. Let $next:var be ~not-started~.
    1. Repeat, while $next:var is not ~done~,
      1. Set $next:var to ? IteratorStepValue($iter:var).
      1. $body:step*
closureConfig:
  aoName: "IN__SetDataIterateIterator"
  iterBase: "$iter"
  elementVar: "$next"
  earlyReturn: true
subrules:
  - name: "SetData While+Iterator >> SetData Remove"
    where: "1. Let $wIndex:var be SetDataIndex($wBase:var, $wElem:var)."
    subrules:
      - name: "SetData While+Iterator >> SetData Remove"
        pattern: "1. Set $wBase:var[$wIndex:var] to ~empty~."
        replace: "1. Perform IN__SetDataRemove($wBase:var, $wElem:var)."
      - name: "SetData While+Iterator >> SetData Has"
        pattern: "$wIndex:var is not ~not-found~"
        replace: "IN__SetDataHas($wBase:var, $wElem:var) is *true*"
  - name: "SetData While+Iterator >> SetData Has"
    where: "1. Let $wIndex:var be SetDataIndex($wBase:var, $wElem:var)."
    subrules:
      - name: "SetData While+Iterator >> SetData Has"
        pattern: "$wIndex:var is ~not-found~"
        replace: "IN__SetDataHas($wBase:var, $wElem:var) is *false*"
