name: "MapData Has"
pattern: |
    1. For each element $elem:var of $base:ref, do
      1. If $elem:var.[[Key]] is not ~empty~ and SameValue($elem:var.[[Key]], $key:var) is *true*, $body:step
replace: "1. If IN__MapDataHas($base:ref, $key:var) = *true*, $body:step"
predicate: $base -> isMapData
subrules:
  - name: "MapData Has >> MapData Remove"
    pattern: |
        1. Set $elem:var.[[Key]] to ~empty~.
        1. Set $elem:var.[[Value]] to ~empty~.
    replace: "1. Perform IN__MapDataRemove($base:var, $key:var)."
  - name: "MapData Has >> MapData Set"
    pattern: "1. Set $elem:var.[[Value]] to $expr:expr."
    replace: "1. Perform IN__MapDataInsert($base:var, a new Record { [[Key]]: $key:var, [[Value]]: $expr:expr })."
  - name: "MapData Has >> MapData Get"
    pattern: "1. Return $elem:var.[[Value]]."
    replace: "1. Return IN__MapDataGet($base:var, $key:var)."
