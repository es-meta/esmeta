name: polyfill
on:
  push:
    branches-ignore:
      - scalajs
    paths:
      - .github/workflows/polyfill.yml
      - build.sbt
      - ecma262
      - src/main/resources/manuals/**
      - src/main/resources/polyfill/**
      - src/main/scala/esmeta/es/util/polyfill/**
      - src/main/scala/esmeta/extractor/**
      - src/main/scala/esmeta/lang/**
      - src/main/scala/esmeta/phase/GenPoly.scala
      - src/main/scala/esmeta/spec/**
      - tests/polyfill/**
  pull_request:
    branches-ignore:
      - scalajs
    paths:
      - .github/workflows/polyfill.yml
      - build.sbt
      - ecma262
      - src/main/resources/manuals/**
      - src/main/resources/polyfill/**
      - src/main/scala/esmeta/es/util/polyfill/**
      - src/main/scala/esmeta/extractor/**
      - src/main/scala/esmeta/lang/**
      - src/main/scala/esmeta/phase/GenPoly.scala
      - src/main/scala/esmeta/spec/**
      - tests/polyfill/**
env:
  ESMETA_HOME: ${{ github.workspace }}
jobs:
  test262:
    # skip `pull_request` runs for same-repository branches, already tested by `push`
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: sbt

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tests/polyfill/package-lock.json

    - name: Generate polyfills (both configurations)
      run: >-
        sbt
        "run gen-poly -gen-poly:out=logs/polyfill/basic"
        "run gen-poly -gen-poly:opt -gen-poly:out=logs/polyfill/opt"

    - name: Run test262 against the polyfills
      run: |
        cd $ESMETA_HOME/tests/polyfill
        npm ci
        npm test

    - name: Report Status
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
