# Targets for the polyfill end-to-end test.
#
# module      : file emitted by PolyfillPackager under the generated library
# deleteStmt  : removes the host built-in, so the polyfill installs instead of
#               being skipped by its `if (!Base.member)` guard
# testPattern : test262 tests exercising the built-in, relative to the repo root
- name: Array.from
  module: Array.from.js
  deleteStmt: delete Array.from;
  testPattern: test/built-ins/Array/from/*.js
- name: Array.of
  module: Array.of.js
  deleteStmt: delete Array.of;
  testPattern: test/built-ins/Array/of/*.js
